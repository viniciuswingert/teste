<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espelho do Visagismo</title>
  <meta name="description" content="Consultoria de visagismo com inteligência artificial: descubra o corte, a barba, os óculos e as cores que combinam com você.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cellipse cx='50' cy='50' rx='38' ry='46' fill='none' stroke='%23d4a843' stroke-width='8'/%3E%3C/svg%3E">
</head>
<body>
  <!-- Padrões de textura do cabelo usados pelo espelho -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <pattern id="tx-liso" width="6" height="40" patternUnits="userSpaceOnUse">
        <line x1="3" y1="0" x2="3" y2="40" stroke="#fff" stroke-opacity=".22" stroke-width="1.2"/>
      </pattern>
      <pattern id="tx-ondulado" width="16" height="10" patternUnits="userSpaceOnUse">
        <path d="M0 5 Q4 0 8 5 T16 5" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1.3"/>
      </pattern>
      <pattern id="tx-cacheado" width="11" height="11" patternUnits="userSpaceOnUse">
        <circle cx="5.5" cy="5.5" r="3.6" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1.3"/>
      </pattern>
      <pattern id="tx-crespo" width="5" height="5" patternUnits="userSpaceOnUse">
        <circle cx="2.5" cy="2.5" r="1.4" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width=".9"/>
      </pattern>
      <clipPath id="clip-espelho"><ellipse cx="100" cy="130" rx="96" ry="126"/></clipPath>
    </defs>
  </svg>

  <header class="topo">
    <div class="marca">
      <span class="marca-icone" aria-hidden="true"></span>
      <span>Espelho do Visagismo</span>
    </div>
    <p class="marca-sub">Consultoria de imagem com IA</p>
  </header>

  <main class="palco">
    <!-- O espelho: monta o rosto conforme as escolhas -->
    <section class="espelho-area" aria-label="Pré-visualização">
      <div class="espelho" id="espelho">
        <svg viewBox="0 0 200 260" class="espelho-svg" id="rosto-svg" role="img" aria-label="Rosto ilustrado">
          <g clip-path="url(#clip-espelho)">
            <rect width="200" height="260" class="espelho-fundo"/>
            <g id="desenho">
              <path id="pescoco" d="M80 215 L80 262 L120 262 L120 215 Z"/>
              <path id="rosto" d=""/>
              <path id="cabelo" d="M28 118 Q20 22 100 18 Q180 22 172 118 Q164 62 100 56 Q36 62 28 118 Z"/>
              <path id="cabelo-textura" d="M28 118 Q20 22 100 18 Q180 22 172 118 Q164 62 100 56 Q36 62 28 118 Z"/>
              <g id="olhos">
                <path class="sobrancelha" d="M60 108 Q75 100 90 106"/>
                <path class="sobrancelha" d="M110 106 Q125 100 140 108"/>
                <ellipse class="olho" cx="75" cy="124" rx="11" ry="6"/>
                <ellipse class="olho" cx="125" cy="124" rx="11" ry="6"/>
                <circle class="iris" cx="75" cy="124" r="4.5"/>
                <circle class="iris" cx="125" cy="124" r="4.5"/>
              </g>
              <path class="traco" d="M100 132 Q96 152 102 160"/>
              <path class="traco boca" d="M84 182 Q100 190 116 182"/>
            </g>
            <image id="foto-espelho" x="0" y="0" width="200" height="260" preserveAspectRatio="xMidYMid slice" href="" visibility="hidden"/>
            <g id="linhas-guia" aria-hidden="true"></g>
            <rect id="scanner" x="0" y="-20" width="200" height="16"/>
          </g>
        </svg>
        <div class="espelho-brilho" aria-hidden="true"></div>
      </div>
      <ol class="trilha" id="trilha" aria-label="Seu perfil"></ol>
    </section>

    <!-- O painel com uma pergunta por vez -->
    <section class="painel" id="painel" aria-live="polite"></section>
  </main>

  <input type="file" id="arquivo-foto" accept="image/jpeg,image/png,image/webp" hidden>

  <footer class="rodape">
    A foto, se enviada, é usada só para esta análise e não fica guardada no site.
  </footer>

  <script src="app.js" type="module"></script>
</body>
</html>
